<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daedryk GitHub iO</title>
    <style>
        @font-face {
            font-family: 'Triglavian';
            src: url('triglavian-completed.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #ffffff, #0000ff, #ff0000);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Triglavian', 'Times New Roman', serif;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        .content {
            text-align: center;
            z-index: 10;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
            width: 100%;
            max-width: 800px;
            padding: 1.5rem 1rem;
            border-radius: 2rem;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.5);
        }

        .glow-text {
            color: #00ffff;
            text-shadow: 
                0 0 5px #ff3333,
                0 0 15px #cc0000,
                0 0 30px #990000,
                0 0 60px #660000;
            font-weight: 500;
        }

        h1.page-title {
            font-size: clamp(1.5rem, 6.5vw, 3rem);
            line-height: 1.2;
            margin-bottom: 0.2rem;
            font-weight: 600;
            filter: drop-shadow(0 0 8px #a00);
        }

        .welcome {
            font-size: clamp(2rem, 9vw, 4.5rem);
            font-weight: 700;
            margin: 0.2rem 0;
            filter: drop-shadow(0 0 12px #b00);
            line-height: 1.3;
        }

        .enter-link {
            display: inline-block;
            font-size: clamp(1.6rem, 7vw, 3rem);
            font-weight: 600;
            text-decoration: none;
            color: #ffff00;
            text-shadow: 
                0 0 5px #ff4444,
                0 0 20px #cc0000,
                0 0 40px #990000,
                0 0 80px #660000;
            transition: all 0.25s ease-in-out;
            padding: 0.4rem 1.2rem;
            border: 2px solid rgba(180, 0, 0, 0.4);
            border-radius: 12px;
            background: rgba(30, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            margin-top: 0.5rem;
        }

        .enter-link:hover {
            color: #ff8000;
            text-shadow: 
                0 0 10px #ff6666,
                0 0 30px #ff3333,
                0 0 70px #cc0000,
                0 0 100px #990000;
            border-color: #b30000;
            background: rgba(80, 0, 0, 0.35);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(200, 0, 0, 0.7);
        }

        .ornament {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 0 10px #00ccff) drop-shadow(0 0 22px #aa0000);
            transition: filter 0.3s ease;
        }

        .ornament-top {
            margin-bottom: 0.2rem;
        }

        .ornament-bottom {
            margin-top: 0.2rem;
        }

        @media (max-width: 600px) {
            .content {
                gap: 1rem;
                padding: 1.2rem 0.8rem;
                background: rgba(0, 0, 0, 0.35);
            }
            .enter-link {
                padding: 0.35rem 0.9rem;
            }
            .ornament {
                max-width: 90%;
            }
        }

        .ornament .glow-stroke {
            filter: drop-shadow(0 0 4px cyan) drop-shadow(0 0 8px #ff3300);
        }

        .sway-line {
            transition: transform 0.45s cubic-bezier(0.34, 1.2, 0.64, 1);
            will-change: transform;
        }
    </style>
</head>

    <script>
        (function() {
            const lines = document.querySelectorAll('.sway-line');

            lines.forEach(line => {
                const baseX = parseFloat(line.dataset.baseX) || 0;
                const initialOffset = (Math.random() * 4) - 2;
                line.style.transform = `translateX(${initialOffset}px)`;
            });

            function randomBetween(min, max) {
                return Math.random() * (max - min) + min;
            }

            function scheduleSway(line) {
                const delay = randomBetween(400, 2600);
                setTimeout(() => {
                    const offset = randomBetween(-6, 6);
                    line.style.transform = `translateX(${offset}px)`;
                    scheduleSway(line);
                }, delay);
            }

            lines.forEach(line => {
                const initialDelay = randomBetween(100, 1800);
                setTimeout(() => {
                    scheduleSway(line);
                }, initialDelay);
            });

            lines.forEach((line, index) => {
                const duration = randomBetween(0.35, 0.7);
                line.style.transition = `transform ${duration}s cubic-bezier(0.34, 1.2, 0.64, 1)`;
            });
        })();
    </script>
