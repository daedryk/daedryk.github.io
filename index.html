<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daedryk GitHub iO</title>
    <style>
        @font-face {
            font-family: 'Triglavian';
            src: url('triglavian-completed.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #ff0000, #d4af37, #000000);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Triglavian'
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        .content {
            text-align: center;
            z-index: 10;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            width: 100%;
            max-width: 800px;
            padding: 2rem 1rem;
            border-radius: 2rem;
            background: rgba(255, 215, 0, 1);
            backdrop-filter: blur(4px);
            box-shadow: 0 0 50px rgba(0, 180, 0, 0.25);
        }

        .glow-text {
            color: #00ffff;
            text-shadow: 
                0 0 5px #ff3333,
                0 0 15px #cc0000,
                0 0 30px #990000,
                0 0 60px #660000;
            font-weight: 500;
        }

        h1.page-title {
            font-size: clamp(1.5rem, 6.5vw, 3rem);
            line-height: 1.2;
            margin-bottom: 0.5rem;
            font-weight: 600;
            filter: drop-shadow(0 0 8px #a00);
        }

        .welcome {
            font-size: clamp(2rem, 9vw, 4.5rem);
            font-weight: 700;
            margin: 0.5rem 0;
            filter: drop-shadow(0 0 12px #b00);
        }

        .enter-link {
            display: inline-block;
            font-size: clamp(1.6rem, 7vw, 3rem);
            font-weight: 600;
            text-decoration: none;
            color: #ffff00;
            text-shadow: 
                0 0 5px #ff4444,
                0 0 20px #cc0000,
                0 0 40px #990000,
                0 0 80px #660000;
            transition: all 0.25s ease-in-out;
            padding: 0.4rem 1.2rem;
            border: 2px solid rgba(180, 0, 0, 0.4);
            border-radius: 12px;
            background: rgba(30, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            margin-top: 1rem;
        }

        .enter-link:hover {
            color: #ff8000;
            text-shadow: 
                0 0 10px #ff6666,
                0 0 30px #ff3333,
                0 0 70px #cc0000,
                0 0 100px #990000;
            border-color: #b30000;
            background: rgba(80, 0, 0, 0.35);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(200, 0, 0, 0.7);
        }

        @media (max-width: 600px) {
            .content {
                gap: 1.2rem;
                padding: 1.5rem 1rem;
                background: rgba(0, 0, 0, 0.1);
            }
            .enter-link {
                padding: 0.35rem 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="content">
        <h1 class="page-title glow-text">Daedryk GitHub iO</h1>
        
        <div class="welcome glow-text">Welcome to<br>Triglavian<br>Collective<br>IRL</div>
        
        <a href="ok.html" class="enter-link glow-text">ENTER</a>
    </div>

</body>
</html>
