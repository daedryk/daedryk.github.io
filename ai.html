<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prosto srce</title>
  <style>
    @font-face {
      font-family: 'Triglavian Completed';
      src: url('triglavian-completed.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 50%, #1a0e08, #0a0505 70%);
      font-family: 'Triglavian Completed', 'Times New Roman', serif;
      padding: 2rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        repeating-linear-gradient(45deg, rgba(255,180,80,0.015) 0px, rgba(255,180,80,0.015) 2px, transparent 2px, transparent 6px),
        radial-gradient(circle at 80% 70%, rgba(255, 140, 60, 0.06) 0%, transparent 55%);
      pointer-events: none;
    }

    .metal-card {
      position: relative;
      max-width: 1000px;
      width: 100%;
      padding: 3.5rem 2.5rem 3rem 2.5rem;
      background: linear-gradient(145deg, #1a1210, #0e0808);
      border-radius: 48px 48px 32px 32px;
      box-shadow: 
        0 30px 50px -15px rgba(0, 0, 0, 0.9),
        0 0 0 1px rgba(255, 180, 100, 0.1),
        inset 0 2px 4px rgba(255, 200, 150, 0.06),
        inset 0 -6px 12px rgba(0, 0, 0, 0.8);
      border-bottom: 2px solid rgba(255, 140, 60, 0.2);
      border-top: 1px solid rgba(255, 200, 150, 0.1);
      animation: subtle-shine 8s infinite alternate;
    }

    .metal-card::after {
      content: '';
      position: absolute;
      inset: 12px;
      border-radius: 36px 36px 24px 24px;
      border: 1px solid rgba(255, 160, 80, 0.08);
      pointer-events: none;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.7);
    }

    .burning-text {
      font-family: 'Triglavian Completed', 'Times New Roman', serif;
      font-weight: normal;
      color: #fff0dd;
      text-shadow: 
        0 0 6px #ffdcaa,
        0 0 12px #ffb060,
        0 0 20px #ff8a20,
        0 0 32px #ff6010,
        0 0 48px #ff4000,
        0 0 70px #ff2000,
        0 0 100px #cc1000,
        0 0 140px #991000;
      line-height: 1.2;
      transition: text-shadow 0.3s ease;
    }

    h1.burning-text {
      font-size: clamp(3.5rem, 12vw, 6.5rem);
      text-align: center;
      margin-bottom: 0.5rem;
      color: #fff5e6;
      text-shadow: 
        0 0 8px #ffe0b0,
        0 0 16px #ffc070,
        0 0 26px #ff9020,
        0 0 40px #ff6810,
        0 0 60px #ff4000,
        0 0 85px #ff2000,
        0 0 120px #cc1000,
        0 0 170px #991000;
    }

    .poem.burning-text {
      font-size: clamp(1.2rem, 3.5vw, 2rem);
      text-align: left;
      max-width: 700px;
      margin: 2rem auto 1rem auto;
      padding: 1.5rem 2rem;
      line-height: 2.2;
      background: rgba(20, 10, 5, 0.5);
      border-radius: 24px;
      border-left: 4px solid rgba(255, 140, 50, 0.5);
      border-bottom: 2px solid rgba(255, 100, 30, 0.3);
      box-shadow: 
        inset 0 5px 12px rgba(0, 0, 0, 0.8),
        0 10px 20px -8px black,
        0 0 0 1px rgba(255, 180, 100, 0.1);
      backdrop-filter: blur(2px);
      text-shadow: 
        0 0 5px #ffdcaa,
        0 0 10px #ffb060,
        0 0 18px #ff8a20,
        0 0 28px #ff6010,
        0 0 42px #ff4000,
        0 0 62px #ff2000,
        0 0 90px #cc1000;
    }

    .poem.burning-text span {
      display: block;
    }

    .burning-text:hover {
      text-shadow: 
        0 0 8px #fff0cc,
        0 0 16px #ffc880,
        0 0 26px #ffa040,
        0 0 40px #ff7820,
        0 0 58px #ff5010,
        0 0 80px #ff3000,
        0 0 110px #dd1800,
        0 0 150px #aa1000;
      transition: text-shadow 0.3s ease;
    }

    @keyframes subtle-shine {
      0% { box-shadow: 0 30px 50px -15px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 180, 100, 0.1), inset 0 2px 4px rgba(255, 200, 150, 0.06), inset 0 -6px 12px rgba(0, 0, 0, 0.8); }
      100% { box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 180, 100, 0.2), inset 0 2px 10px rgba(255, 200, 150, 0.1), inset 0 -6px 18px rgba(0, 0, 0, 0.9); }
    }

    .footnote {
      font-family: 'Triglavian Completed', serif;
      color: #c09060;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      text-shadow: 0 0 10px rgba(255, 120, 30, 0.6), 0 0 20px rgba(255, 60, 0, 0.3);
      opacity: 0.8;
    }

    @media (max-width: 600px) {
      .metal-card {
        padding: 2rem 1.2rem 2rem 1.2rem;
        border-radius: 32px 32px 24px 24px;
      }
      .poem.burning-text {
        padding: 1rem 1rem;
        line-height: 2;
      }
      h1.burning-text {
        font-size: 3rem;
      }
    }
  </style>
</head>
<body>
  <div class="metal-card">
    <h1 class="burning-text">Prosto srce</h1>

    <div class="poem burning-text">
      <span>Sem dolgo upal in se bal,</span>
      <span>slovo sem upu, strahu dal;</span>
      <span>srce ye prazno, srechno ni,</span>
      <span>nazay si up in strah zheli.</span>
    </div>

    <div class="footnote">✦ ✦ ✦</div>
  </div>
</body>
</html>
