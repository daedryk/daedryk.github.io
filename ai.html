<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prosto srce</title>
  <style>
    @font-face {
      font-family: 'Triglavian Completed';
      src: url('triglavian-completed.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fef5e7;
      background-image: linear-gradient(145deg, #fff5e6 0%, #ffecd9 100%);
      font-family: 'Triglavian Completed', 'Times New Roman', serif;
      padding: 2rem 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 70% 20%, rgba(255, 200, 170, 0.2), transparent 70%);
      pointer-events: none;
    }

    .metal-card {
      position: relative;
      max-width: 1000px;
      width: 100%;
      padding: 3rem 2.5rem 2.8rem 2.5rem;
      background: #fffaf2;
      border-radius: 48px 48px 32px 32px;
      box-shadow: 0 20px 30px -10px rgba(200, 50, 30, 0.2),
                  0 0 0 1px rgba(220, 80, 60, 0.2),
                  inset 0 1px 4px rgba(255, 240, 230, 0.8);
      border-bottom: 2px solid rgba(200, 60, 40, 0.3);
      border-top: 1px solid rgba(255, 200, 180, 0.6);
    }

    ::selection {
      background: #ff3b2f;
      color: #fff9f0;
      text-shadow: none;
    }

    ::-moz-selection {
      background: #ff3b2f;
      color: #fff9f0;
      text-shadow: none;
    }

    .burning-text {
      font-family: 'Triglavian Completed', 'Times New Roman', serif;
      font-weight: normal;
      color: #b32b1a;
      line-height: 1.2;
      text-shadow: 0 0 6px #ffb3a0, 0 0 12px #ff8a70;
    }

    h1.burning-text {
      font-size: clamp(3.5rem, 12vw, 6.5rem);
      text-align: center;
      margin-bottom: 0.5rem;
      color: #a52a1a;
      text-shadow: 0 0 8px #ffc2b0, 0 0 16px #ff7a60;
    }

    .poem.burning-text {
      font-size: clamp(1.2rem, 3.5vw, 2rem);
      text-align: left;
      max-width: 700px;
      margin: 2rem auto 1rem auto;
      padding: 1.5rem 2rem;
      line-height: 2.2;
      background: #fff8f0;
      border-radius: 24px;
      border-left: 4px solid #d94f3a;
      border-bottom: 2px solid #b33a28;
      box-shadow: 0 8px 16px -8px rgba(180, 60, 40, 0.3),
                  inset 0 1px 6px rgba(255, 230, 220, 0.8);
      text-shadow: 0 0 5px #ffb3a0, 0 0 10px #ff8a70;
    }

    .poem.burning-text span {
      display: block;
    }

    .burning-text:hover {
      text-shadow: 0 0 8px #ffb09a, 0 0 16px #ff6a50;
    }

    .footnote {
      font-family: 'Triglavian Completed', 'Times New Roman', serif;
      color: #b34a30;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 3.5rem;
      line-height: 1.4;
      text-shadow: 0 0 10px #ffb09a, 0 0 20px #ff5a40;
      opacity: 1;
    }

    .footnote a {
      color: inherit;
      text-decoration: none;
      display: inline-block;
    }

    .player {
      display: flex;
      align-items: center;
      gap: 1rem;
      max-width: 700px;
      margin: 1.5rem auto 0 auto;
      padding: 0.8rem 1.2rem;
      background: #fff8f0;
      border-radius: 24px;
      border-left: 4px solid #d94f3a;
      border-bottom: 2px solid #b33a28;
      box-shadow: 0 8px 16px -8px rgba(180, 60, 40, 0.3),
                  inset 0 1px 6px rgba(255, 230, 220, 0.8);
    }

    .play-btn {
      font-family: 'Triglavian Completed', 'Times New Roman', serif;
      font-size: 2rem;
      line-height: 1;
      background: transparent;
      border: none;
      cursor: pointer;
      color: #a52a1a;
      text-shadow: 0 0 8px #ffc2b0, 0 0 16px #ff7a60;
      padding: 0;
      width: 2.4rem;
      text-align: center;
    }

    .play-btn:hover {
      text-shadow: 0 0 10px #ffb09a, 0 0 20px #ff6a50;
    }

    .progress-wrap {
      flex: 1;
      height: 14px;
      background: #f5d8c8;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      box-shadow: inset 0 2px 4px rgba(180, 60, 40, 0.25);
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff5a40, #d92e18);
      border-radius: 10px;
      box-shadow: 0 0 8px #ff6a50;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .metal-card {
        padding: 2rem 1.2rem 2rem 1.2rem;
        border-radius: 32px 32px 24px 24px;
      }
      .poem.burning-text {
        padding: 1rem 1rem;
        line-height: 2;
      }
      h1.burning-text {
        font-size: 3rem;
      }
      .footnote {
        font-size: 2.8rem;
      }
      .play-btn {
        font-size: 1.6rem;
        width: 2rem;
      }
      .progress-wrap {
        height: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="metal-card">
    <h1 class="burning-text">Prosto srce</h1>

    <div class="poem burning-text">
      <span>Sem dolgo upal in se bal,</span>
      <span>slovo sem upu, strahu dal;</span>
      <span>srce ye prazno, srechno ni,</span>
      <span>nazay si up in strah zheli.</span>
    </div>

    <div class="footnote">
      <a href="https://daedryk.github.io" aria-label="heart fire">❤️‍🔥</a>
    </div>

    <div class="player">
      <button class="play-btn" id="playBtn" aria-label="play">🤬</button>
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
  </div>

  <audio id="audio" src="storm.m4a" preload="metadata"></audio>

  <script>
    (function () {
      const audio = document.getElementById('audio');
      const playBtn = document.getElementById('playBtn');
      const progressWrap = document.getElementById('progressWrap');
      const progressBar = document.getElementById('progressBar');

      function setPlayIcon() {
        playBtn.textContent = audio.paused ? '🤬' : '🫯';
      }

      playBtn.addEventListener('click', function () {
        if (audio.paused) {
          audio.play();
        } else {
          audio.pause();
        }
      });

      audio.addEventListener('play', setPlayIcon);
      audio.addEventListener('pause', setPlayIcon);
      audio.addEventListener('ended', function () {
        setPlayIcon();
        progressBar.style.width = '0%';
      });

      audio.addEventListener('timeupdate', function () {
        if (audio.duration && isFinite(audio.duration)) {
          const pct = (audio.currentTime / audio.duration) * 100;
          progressBar.style.width = pct + '%';
        }
      });

      audio.addEventListener('loadedmetadata', function () {
        progressBar.style.width = '0%';
      });

      progressWrap.addEventListener('click', function (e) {
        if (!audio.duration || !isFinite(audio.duration)) return;
        const rect = progressWrap.getBoundingClientRect();
        const ratio = (e.clientX - rect.left) / rect.width;
        const clamped = Math.min(1, Math.max(0, ratio));
        audio.currentTime = clamped * audio.duration;
      });

      setPlayIcon();
    })();
  </script>
</body>
</html>
