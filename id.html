<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Smooth</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(145deg, #4a7a6a, #3a6a5a);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
      position: relative;
      overflow-x: hidden;
    }

    .id-card {
      width: 680px;
      max-width: 92vw;
      background: linear-gradient(145deg, #b8c9c0, #8fa8a0);
      border: 2px solid #d4e8e0;
      border-radius: 40px;
      padding: 2.2rem 2rem 2rem 2rem;
      color: #1a2b26;
      box-shadow: 0 20px 40px -8px rgba(0, 20, 15, 0.7), inset 0 1px 4px rgba(255, 255, 245, 0.6);
      backdrop-filter: blur(1px);
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    .svg-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.7;
      border-radius: 40px;
      overflow: hidden;
    }

    .svg-bg svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .id-card > *:not(.svg-bg) {
      position: relative;
      z-index: 1;
    }

    .selfie-container {
      position: relative;
      margin-bottom: 1.75rem;
      border-radius: 28px;
      overflow: hidden;
      border: 2px solid #b2ccc2;
      background-color: #cedfd6;
      box-shadow: 0 8px 18px rgba(0,0,0,0.2), inset 0 0 0 1px rgba(255,255,240,0.3);
    }

    .selfie-img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
      vertical-align: middle;
    }

    .page-title-on-image {
      position: absolute;
      top: 1rem;
      left: 1.2rem;
      background: rgba(180, 200, 190, 0.7);
      backdrop-filter: blur(4px);
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
      font-size: 1.55rem;
      font-weight: 800;
      color: #0f1f1a;
      text-shadow: 0 1px 2px #d0e6dd;
      border-left: 4px solid #aac7bb;
      pointer-events: none;
      z-index: 2;
      white-space: nowrap;
    }

    @media (max-width: 540px) {
      .page-title-on-image {
        font-size: 1rem;
        padding: 0.3rem 0.8rem;
        top: 0.6rem;
        left: 0.8rem;
        white-space: nowrap;
      }
    }

    .info-field {
      border: 2px solid #aac0b6;
      border-radius: 40px;
      background-color: rgba(212, 229, 220, 0.85);
      padding: 1rem 2rem;
      margin-bottom: 1.4rem;
      word-break: break-word;
      transition: border-color 0.15s, background-color 0.15s;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.04);
      backdrop-filter: blur(2px);
    }

    .info-field:hover {
      border-color: #e6f5ed;
      background-color: rgba(225, 240, 232, 0.9);
    }

    .label {
      font-size: 0.9rem;
      text-transform: uppercase;
      color: #2f4a40;
      opacity: 0.9;
      margin-bottom: 0.3rem;
      font-weight: 500;
    }

    .value {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
      color: #0b1f19;
    }

    .value.address { font-size: 1rem; }
    .value.mail { word-break: break-all; }

    .info-field:last-of-type {
      margin-bottom: 0;
    }

    .badge {
      display: flex;
      justify-content: center;
      margin-bottom: 1.2rem;
      color: #1f3b32;
      font-weight: bold;
      font-size: 1.9rem;
      border-bottom: 1px dashed #6d8f81;
      padding-bottom: 0.6rem;
    }

    a, a:visited {
      color: #0d2b22;
      text-decoration: none;
      border-bottom: none;
      transition: color 0.2s;
    }

    a:hover {
      color: #3d6255;
      text-decoration: none;
      border-bottom: none;
    }

    .home-link {
      margin-top: 1.8rem;
      border-top: 2px dotted #6d8f81;
      padding-top: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .home-link a:last-child {
      font-size: 1.2rem;
      font-weight: 700;
      display: inline-block;
      line-height: 1.2;
    }

    .home-link a:first-child {
      font-size: 2.8rem;
      line-height: 1.2;
      display: inline-block;
      text-decoration: none;
      border-bottom: none;
    }

    .home-link a:first-child:hover {
      opacity: 0.8;
      border-bottom: none;
    }

    .player-section {
      margin-top: 2rem;
      border: 2px solid #aac0b6;
      border-radius: 40px;
      background-color: rgba(212, 229, 220, 0.85);
      padding: 1.4rem 2rem;
      transition: border-color 0.15s, background-color 0.15s;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.04);
      backdrop-filter: blur(2px);
    }

    .player-section:hover {
      border-color: #e6f5ed;
      background-color: rgba(225, 240, 232, 0.9);
    }

    .player-title {
      font-size: 1rem;
      text-transform: uppercase;
      color: #1f3b32;
      margin-bottom: 1rem;
      font-weight: 700;
      border-bottom: 1px dashed #6d8f81;
      padding-bottom: 0.4rem;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    .play-pause-btn {
      background: none;
      border: 2px solid #698b7c;
      border-radius: 60px;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.1s linear;
      background-color: #a6c2b6;
      color: transparent;
      text-indent: -9999px;
      font-size: 0;
      line-height: 0;
      padding: 0;
      box-shadow: 0 0 8px #c0ddd0;
    }

    .play-pause-btn:hover {
      background-color: #bdd9cd;
      border-color: #7fa397;
      box-shadow: 0 0 14px #d4eee2;
    }

    .progress-container {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .progress-bar {
      width: 100%;
      height: 14px;
      background-color: #b2ccc2;
      border: 2px solid #698b7c;
      border-radius: 20px;
      appearance: none;
      cursor: pointer;
    }

    .progress-bar::-webkit-progress-bar {
      background-color: #b2ccc2;
      border-radius: 20px;
    }

    .progress-bar::-webkit-progress-value {
      background-color: #3e6b5c;
      border-radius: 20px;
    }

    .progress-bar::-moz-progress-bar {
      background-color: #3e6b5c;
      border-radius: 20px;
    }

    audio {
      display: none;
    }

    * {
      letter-spacing: 0 !important;
    }
    .label, .value, .badge, .home-link, .player-title, .page-title-on-image {
      letter-spacing: 0 !important;
    }
  </style>
</head>
<body>
  <div class="id-card">
    <div class="svg-bg" id="svgContainer">
      <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" id="gridSvg">
        <defs>
          <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <rect width="1200" height="800" fill="#3a6a5a" opacity="0.12"/>
        <g id="gridGroup" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
        </g>
      </svg>
    </div>

    <div class="selfie-container">
      <img class="selfie-img" src="777298010_1385532809699680_3337808481119840559_n.webp" alt="Dejan selfie" onerror="this.onerror=null; this.style.opacity='0.7'; this.style.filter='grayscale(0.2)';">
      <div class="page-title-on-image">魏魔族 · 血统档案</div>
    </div>

    <div class="badge">
      <a href="w.html">Agent Smooth</a>
    </div>

    <div class="info-field">
      <div class="label">full name</div>
      <div class="value">Dejan Ilič</div>
    </div>
    <div class="info-field">
      <div class="label">date of birth</div>
      <div class="value">March 31st 1980</div>
    </div>
    <div class="info-field">
      <div class="label">address</div>
      <div class="value address">
        Toplarniška ulica 9<br>1000 Ljubljana, Slovenia
      </div>
    </div>
    <div class="info-field">
      <div class="label">phone</div>
      <div class="value">
        <a href="tel:+38630455165">+386 30 455 165</a>
      </div>
    </div>
    <div class="info-field">
      <div class="label">e‑mail</div>
      <div class="value mail">
        <a href="mailto:daedryk@proton.me">daedryk@proton.me</a>
      </div>
    </div>

    <div class="home-link">
      <a href="MyHeritage_raw_dna_data.zip">🧬</a>
      <a href="si.html">UNIMATRIX ONE</a>
    </div>

    <div class="player-section">
      <div class="player-title">mouse trap</div>
      <div class="player-controls">
        <button class="play-pause-btn" id="playPauseBtn" aria-label="play/pause"></button>
        <div class="progress-container">
          <progress class="progress-bar" id="progressBar" value="0" max="100"></progress>
        </div>
      </div>
    </div>
  </div>

  <audio id="track" src="trap.mp3" preload="metadata"></audio>

  <script>
    (function() {
      const playBtn = document.getElementById('playPauseBtn');
      const progressBar = document.getElementById('progressBar');
      const audio = document.getElementById('track');
      let animationFrame = null;
      let wasSeeking = false;

      const updateProgress = () => {
        if (!audio.duration || isNaN(audio.duration) || !audio.duration) {
          progressBar.value = 0;
          return;
        }
        const percent = (audio.currentTime / audio.duration) * 100;
        progressBar.value = Math.min(100, Math.max(0, percent));
      };

      const whilePlaying = () => {
        if (audio.ended) {
          playBtn.style.backgroundColor = '#a6c2b6';
          progressBar.value = 0;
          if (animationFrame) {
            cancelAnimationFrame(animationFrame);
            animationFrame = null;
          }
          return;
        }
        if (!audio.paused && audio.duration) {
          updateProgress();
          animationFrame = requestAnimationFrame(whilePlaying);
        } else {
          if (animationFrame) {
            cancelAnimationFrame(animationFrame);
            animationFrame = null;
          }
        }
      };

      const togglePlayback = () => {
        if (audio.paused) {
          if (audio.ended) {
            audio.currentTime = 0;
          }
          const playPromise = audio.play();
          if (playPromise !== undefined) {
            playPromise
              .then(() => {
                playBtn.style.backgroundColor = '#6f9c8a';
                if (animationFrame) cancelAnimationFrame(animationFrame);
                animationFrame = requestAnimationFrame(whilePlaying);
              })
              .catch(() => {
                playBtn.style.backgroundColor = '#a6c2b6';
              });
          }
        } else {
          audio.pause();
          playBtn.style.backgroundColor = '#a6c2b6';
          if (animationFrame) {
            cancelAnimationFrame(animationFrame);
            animationFrame = null;
          }
        }
      };

      playBtn.addEventListener('click', togglePlayback);

      progressBar.addEventListener('mousedown', () => {
        if (animationFrame) {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }
        wasSeeking = true;
      });

      progressBar.addEventListener('input', (e) => {
        if (!audio.duration || isNaN(audio.duration)) return;
        const newTime = (progressBar.value / 100) * audio.duration;
        audio.currentTime = newTime;
      });

      progressBar.addEventListener('change', () => {
        if (!audio.duration) return;
        wasSeeking = false;
        if (!audio.paused) {
          if (animationFrame) cancelAnimationFrame(animationFrame);
          animationFrame = requestAnimationFrame(whilePlaying);
        }
      });

      document.addEventListener('mouseup', () => {
        if (wasSeeking) {
          wasSeeking = false;
          if (!audio.paused) {
            if (animationFrame) cancelAnimationFrame(animationFrame);
            animationFrame = requestAnimationFrame(whilePlaying);
          }
        }
      });

      audio.addEventListener('loadedmetadata', () => {
        progressBar.value = 0;
      });

      audio.addEventListener('ended', () => {
        playBtn.style.backgroundColor = '#a6c2b6';
        progressBar.value = 0;
        if (animationFrame) {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }
        audio.currentTime = 0;
      });

      audio.addEventListener('error', () => {});

      playBtn.style.backgroundColor = '#a6c2b6';
      progressBar.value = 0;

      window.addEventListener('beforeunload', () => {
        if (animationFrame) {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }
      });
    })();

    (function() {
      const group = document.getElementById('gridGroup');
      const colors = ['#00ffff', '#ff00ff', '#800080'];
      
      function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function getRandomPosition() {
        return {
          x: getRandomInt(30, 1170),
          y: getRandomInt(30, 770)
        };
      }

      function generateGrid() {
        group.innerHTML = '';
        
        const numElements = getRandomInt(35, 50);
        
        for (let i = 0; i < numElements; i++) {
          const color = colors[getRandomInt(0, 2)];
          const type = getRandomInt(0, 3);
          const pos = getRandomPosition();
          const length = getRandomInt(30, 90);
          const delay = (Math.random() * 1.5).toFixed(1);
          const duration = (1.5 + Math.random() * 2).toFixed(1);
          
          if (type === 0) {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', pos.x);
            circle.setAttribute('cy', pos.y);
            circle.setAttribute('r', getRandomInt(3, 7));
            circle.setAttribute('fill', color);
            circle.setAttribute('opacity', '0');
            
            const animOpacity = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
            animOpacity.setAttribute('attributeName', 'opacity');
            animOpacity.setAttribute('values', '0;0.9;0.3;0.9');
            animOpacity.setAttribute('dur', duration + 's');
            animOpacity.setAttribute('repeatCount', 'indefinite');
            animOpacity.setAttribute('begin', delay + 's');
            circle.appendChild(animOpacity);
            
            const animR = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
            animR.setAttribute('attributeName', 'r');
            animR.setAttribute('values', '3;' + getRandomInt(6, 10) + ';3');
            animR.setAttribute('dur', duration + 's');
            animR.setAttribute('repeatCount', 'indefinite');
            animR.setAttribute('begin', delay + 's');
            circle.appendChild(animR);
            
            group.appendChild(circle);
            continue;
          }
          
          let path = '';
          const orientation = getRandomInt(0, 1);
          if (orientation === 0) {
            const x1 = pos.x;
            const y1 = pos.y;
            const x2 = pos.x + length;
            const y2 = pos.y;
            path = `M ${x1} ${y1} L ${x2} ${y2}`;
          } else {
            const x1 = pos.x;
            const y1 = pos.y;
            const x2 = pos.x;
            const y2 = pos.y + length;
            path = `M ${x1} ${y1} L ${x2} ${y2}`;
          }
          
          const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          pathEl.setAttribute('d', path);
          pathEl.setAttribute('stroke', color);
          pathEl.setAttribute('stroke-width', getRandomInt(1, 2.5));
          
          const animDash = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
          animDash.setAttribute('attributeName', 'stroke-dasharray');
          animDash.setAttribute('from', `0 ${length}`);
          animDash.setAttribute('to', `${length} 0`);
          animDash.setAttribute('dur', duration + 's');
          animDash.setAttribute('repeatCount', 'indefinite');
          animDash.setAttribute('begin', delay + 's');
          pathEl.appendChild(animDash);
          
          const animOffset = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
          animOffset.setAttribute('attributeName', 'stroke-dashoffset');
          animOffset.setAttribute('from', `${length}`);
          animOffset.setAttribute('to', '0');
          animOffset.setAttribute('dur', duration + 's');
          animOffset.setAttribute('repeatCount', 'indefinite');
          animOffset.setAttribute('begin', delay + 's');
          pathEl.appendChild(animOffset);
          
          const animOpacity = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
          animOpacity.setAttribute('attributeName', 'stroke-opacity');
          animOpacity.setAttribute('values', '0.15;1;0.15');
          animOpacity.setAttribute('dur', (duration * 0.7).toFixed(1) + 's');
          animOpacity.setAttribute('repeatCount', 'indefinite');
          pathEl.appendChild(animOpacity);
          
          group.appendChild(pathEl);
        }
        
        for (let i = 0; i < getRandomInt(8, 15); i++) {
          const color = colors[getRandomInt(0, 2)];
          const start = getRandomPosition();
          const end = getRandomPosition();
          const delay = (Math.random() * 1.8).toFixed(1);
          const duration = (2 + Math.random() * 2).toFixed(1);
          
          const path = `M ${start.x} ${start.y} L ${end.x} ${end.y}`;
          const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          pathEl.setAttribute('d', path);
          pathEl.setAttribute('stroke', color);
          pathEl.setAttribute('stroke-width', '1.2');
          pathEl.setAttribute('opacity', '0.25');
          
          const animDash = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
          const dist = Math.sqrt(Math.pow(end.x - start.x, 2) + Math.pow(end.y - start.y, 2));
          animDash.setAttribute('attributeName', 'stroke-dasharray');
          animDash.setAttribute('from', `0 ${dist}`);
          animDash.setAttribute('to', `${dist} 0`);
          animDash.setAttribute('dur', duration + 's');
          animDash.setAttribute('repeatCount', 'indefinite');
          animDash.setAttribute('begin', delay + 's');
          pathEl.appendChild(animDash);
          
          const animOffset = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
          animOffset.setAttribute('attributeName', 'stroke-dashoffset');
          animOffset.setAttribute('from', `${dist}`);
          animOffset.setAttribute('to', '0');
          animOffset.setAttribute('dur', duration + 's');
          animOffset.setAttribute('repeatCount', 'indefinite');
          animOffset.setAttribute('begin', delay + 's');
          pathEl.appendChild(animOffset);
          
          group.appendChild(pathEl);
        }

        for (let i = 0; i < getRandomInt(5, 10); i++) {
          const color = colors[getRandomInt(0, 2)];
          const pos = getRandomPosition();
          const size = getRandomInt(8, 16);
          const delay = (Math.random() * 1.5).toFixed(1);
          const duration = (1.8 + Math.random() * 1.8).toFixed(1);
          
          const hPath = `M ${pos.x - size/2} ${pos.y} L ${pos.x + size/2} ${pos.y}`;
          const hEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          hEl.setAttribute('d', hPath);
          hEl.setAttribute('stroke', color);
          hEl.setAttribute('stroke-width', '1.5');
          
          const animDashH = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
          animDashH.setAttribute('attributeName', 'stroke-dasharray');
          animDashH.setAttribute('from', `0 ${size}`);
          animDashH.setAttribute('to', `${size} 0`);
          animDashH.setAttribute('dur', duration + 's');
          animDashH.setAttribute('repeatCount', 'indefinite');
          animDashH.setAttribute('begin', delay + 's');
          hEl.appendChild(animDashH);
          
          const animOffsetH = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
          animOffsetH.setAttribute('attributeName', 'stroke-dashoffset');
          animOffsetH.setAttribute('from', `${size}`);
          animOffsetH.setAttribute('to', '0');
          animOffsetH.setAttribute('dur', duration + 's');
          animOffsetH.setAttribute('repeatCount', 'indefinite');
          animOffsetH.setAttribute('begin', delay + 's');
          hEl.appendChild(animOffsetH);
          
          group.appendChild(hEl);
          
          const vPath = `M ${pos.x} ${pos.y - size/2} L ${pos.x} ${pos.y + size/2}`;
          const vEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          vEl.setAttribute('d', vPath);
          vEl.setAttribute('stroke', color);
          vEl.setAttribute('stroke-width', '1.5');
          
          const animDashV = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
          animDashV.setAttribute('attributeName', 'stroke-dasharray');
          animDashV.setAttribute('from', `0 ${size}`);
          animDashV.setAttribute('to', `${size} 0`);
          animDashV.setAttribute('dur', duration + 's');
          animDashV.setAttribute('repeatCount', 'indefinite');
          animDashV.setAttribute('begin', (parseFloat(delay) + 0.3).toFixed(1) + 's');
          vEl.appendChild(animDashV);
          
          const animOffsetV = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
          animOffsetV.setAttribute('attributeName', 'stroke-dashoffset');
          animOffsetV.setAttribute('from', `${size}`);
          animOffsetV.setAttribute('to', '0');
          animOffsetV.setAttribute('dur', duration + 's');
          animOffsetV.setAttribute('repeatCount', 'indefinite');
          animOffsetV.setAttribute('begin', (parseFloat(delay) + 0.3).toFixed(1) + 's');
          vEl.appendChild(animOffsetV);
          
          group.appendChild(vEl);
        }
      }

      generateGrid();
      setInterval(generateGrid, getRandomInt(2500, 4000));
    })();
  </script>
</body>
</html>
