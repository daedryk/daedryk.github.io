<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genetic traits · heritage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 20%, #0d0f1a, #030407);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
        }

        .card {
            max-width: 820px;
            width: 100%;
            background: rgba(18, 22, 36, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 3.5rem 3.5rem 2.5rem 2.5rem;
            padding: 2.8rem 2.5rem 3rem;
            box-shadow: 0 25px 45px -10px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(180, 140, 255, 0.15);
            border: 1px solid rgba(200, 170, 255, 0.2);
            transition: all 0.2s ease;
        }

        .dna-ornament {
            display: flex;
            justify-content: center;
            margin-bottom: 1.6rem;
        }

        .dna-ornament svg {
            width: 100%;
            max-width: 400px;
            height: auto;
            filter: drop-shadow(0 0 12px rgba(150, 80, 255, 0.4));
            display: block;
        }

        .title {
            text-align: center;
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #f2e9ff;
            text-shadow: 0 0 10px #b27aff, 0 0 30px #6d3bd0;
            margin-bottom: 2rem;
            word-break: break-word;
            background: linear-gradient(135deg, #d9caff, #f0e6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 4px 6px #00000055);
        }

        .traits-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 0.75rem;
            margin: 1.2rem 0 0.8rem;
        }

        .traits-table tr {
            transition: all 0.15s;
        }

        .traits-table td {
            background: rgba(28, 32, 52, 0.7);
            backdrop-filter: blur(2px);
            padding: 1.2rem 1.8rem;
            border-radius: 60px;
            font-size: 1.5rem;
            font-weight: 500;
            color: #f0ecff;
            border: 1px solid rgba(185, 150, 255, 0.25);
            box-shadow: 0 8px 14px -8px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            letter-spacing: 0.3px;
        }

        .traits-table td:first-child {
            width: 38%;
            border-top-right-radius: 16px;
            border-bottom-right-radius: 16px;
            border-right: none;
            background: rgba(40, 35, 70, 0.7);
            font-weight: 600;
            color: #d5caff;
            text-shadow: 0 0 6px #6d4bca55;
        }

        .traits-table td:last-child {
            width: 62%;
            border-top-left-radius: 16px;
            border-bottom-left-radius: 16px;
            border-left: none;
            background: rgba(20, 24, 48, 0.8);
            font-weight: 400;
            color: #e7dfff;
            letter-spacing: 0.5px;
        }

        .traits-table td:first-child span {
            margin-right: 0.6rem;
            font-size: 2rem;
            filter: drop-shadow(0 0 5px #b27aff66);
        }

        .system-role-label {
            display: inline-block;
            background: #2d254b;
            padding: 0.2rem 1.2rem;
            border-radius: 40px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            color: #bbabf0;
            border: 1px solid #6f55aa55;
            margin-left: 0.25rem;
            font-weight: 300;
            text-transform: uppercase;
        }

        .dna-footer {
            margin-top: 2.5rem;
            display: flex;
            justify-content: center;
            opacity: 0.7;
        }

        .dna-footer svg {
            width: 160px;
            height: auto;
            filter: drop-shadow(0 0 6px #7b5ecb77);
        }

        @media (max-width: 550px) {
            .card {
                padding: 1.8rem 1.2rem 2rem;
                border-radius: 2.5rem;
            }
            .title {
                font-size: 2rem;
            }
            .traits-table td {
                font-size: 1.2rem;
                padding: 0.9rem 1.2rem;
                display: block;
                width: 100% !important;
                border-radius: 30px !important;
                border: 1px solid rgba(185, 150, 255, 0.2);
                margin-bottom: 0.4rem;
                text-align: center;
            }
            .traits-table td:first-child {
                background: rgba(45, 38, 80, 0.8);
            }
            .traits-table td:last-child {
                background: rgba(18, 22, 44, 0.8);
            }
            .traits-table tr {
                display: flex;
                flex-direction: column;
                gap: 0.3rem;
                margin-bottom: 0.9rem;
            }
            .traits-table td:first-child span {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 420px) {
            .title {
                font-size: 1.7rem;
            }
        }

        .glow-text {
            color: #cbb5ff;
        }
    </style>
</head>
<body>
    <div class="card">

        <div class="dna-ornament">
            <svg viewBox="0 0 400 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DNA helix ornament">
                <defs>
                    <linearGradient id="dnaGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#b77aff" />
                        <stop offset="50%" stop-color="#d9b0ff" />
                        <stop offset="100%" stop-color="#8a5edb" />
                    </linearGradient>
                    <linearGradient id="dnaGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#a37aff" />
                        <stop offset="100%" stop-color="#6c47b3" />
                    </linearGradient>
                    <filter id="glowDna" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="3" result="blur" />
                        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                </defs>

                <path d="M 40 10 C 70 25, 70 65, 40 80" stroke="url(#dnaGrad1)" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#glowDna)" opacity="0.9" />
                <path d="M 360 10 C 330 25, 330 65, 360 80" stroke="url(#dnaGrad1)" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#glowDna)" opacity="0.9" />

                <g stroke="#b38bff" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
                    <line x1="48" y1="18" x2="352" y2="18" />
                    <line x1="42" y1="30" x2="358" y2="30" />
                    <line x1="40" y1="42" x2="360" y2="42" />
                    <line x1="42" y1="54" x2="358" y2="54" />
                    <line x1="48" y1="66" x2="352" y2="66" />
                </g>

                <g fill="#d7beff" filter="url(#glowDna)">
                    <circle cx="100" cy="18" r="3.5" />
                    <circle cx="300" cy="18" r="3.5" />
                    <circle cx="75" cy="30" r="3.5" />
                    <circle cx="325" cy="30" r="3.5" />
                    <circle cx="55" cy="42" r="3.5" />
                    <circle cx="345" cy="42" r="3.5" />
                    <circle cx="75" cy="54" r="3.5" />
                    <circle cx="325" cy="54" r="3.5" />
                    <circle cx="100" cy="66" r="3.5" />
                    <circle cx="300" cy="66" r="3.5" />
                </g>

                <g fill="#dfccff" opacity="0.7">
                    <polygon points="200,8 206,14 200,20 194,14" />
                    <polygon points="200,64 206,70 200,76 194,70" />
                </g>
            </svg>
        </div>

        <h1 class="title">✦ Genetic traits ✦</h1>

        <table class="traits-table">
            <tbody>
                <tr>
                    <td>♂️</td>
                    <td>Red Guard</td>
                </tr>
                <tr>
                    <td>♀️</td>
                    <td>Kajiith</td>
                </tr>
                <tr>
                    <td>System role</td>
                    <td>Daedra <span class="system-role-label">★ core</span></td>
                </tr>
            </tbody>
        </table>

        <div class="dna-footer">
            <svg viewBox="0 0 200 45" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <defs>
                    <linearGradient id="dnaSmall" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#b27aff" />
                        <stop offset="100%" stop-color="#8f5fd9" />
                    </linearGradient>
                </defs>
                <path d="M 20 8 C 40 18, 40 28, 20 38" stroke="url(#dnaSmall)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7" />
                <path d="M 180 8 C 160 18, 160 28, 180 38" stroke="url(#dnaSmall)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7" />
                <g stroke="#b38bff" stroke-width="2" stroke-linecap="round" opacity="0.6">
                    <line x1="25" y1="13" x2="175" y2="13" />
                    <line x1="22" y1="20" x2="178" y2="20" />
                    <line x1="22" y1="28" x2="178" y2="28" />
                    <line x1="25" y1="35" x2="175" y2="35" />
                </g>
                <g fill="#cfbaff" opacity="0.5">
                    <circle cx="60" cy="13" r="2" />
                    <circle cx="140" cy="13" r="2" />
                    <circle cx="45" cy="20" r="2" />
                    <circle cx="155" cy="20" r="2" />
                    <circle cx="45" cy="28" r="2" />
                    <circle cx="155" cy="28" r="2" />
                    <circle cx="60" cy="35" r="2" />
                    <circle cx="140" cy="35" r="2" />
                </g>
            </svg>
        </div>

        <div style="text-align: center; margin-top: 1.2rem; color: #7a6a9e; font-size: 0.8rem; letter-spacing: 2px; opacity: 0.6; border-top: 1px dashed #3d2e5e; padding-top: 1rem;">
            ⚛︎ heritage · encoded ⚛︎
        </div>
    </div>
</body>
</html>
